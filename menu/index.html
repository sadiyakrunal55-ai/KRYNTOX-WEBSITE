<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#a7192d">
<title>Digital Food Menu</title>

<style>
*{box-sizing:border-box}

:root{
 --red:#a7192d;
 --cream:#fff9f2;
 --ink:#292321;
}

body{
 margin:0;
 background:var(--cream);
 color:var(--ink);
 font:15px Arial,sans-serif;
 padding-bottom:125px;
}

/* HEADER */

header{
 background:linear-gradient(135deg,#8e1024,#c12b40);
 color:white;
 padding:23px 18px 21px;
 border-radius:0 0 22px 22px;
 box-shadow:0 5px 18px #6d10221f;
}

header h1{
 margin:0;
 font-size:25px;
}

header p{
 margin:7px 0 0;
 color:#ffe6a0;
 font-size:12px;
 letter-spacing:1.4px;
}

/* MAIN */

main{
 max-width:650px;
 margin:auto;
 padding:15px 16px 20px;
}

/* CATEGORY TABS */

.tabs{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding:4px 0 14px;
 scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
 display:none;
}

.tabs button{
 white-space:nowrap;
 border:1px solid var(--red);
 background:#fff;
 color:var(--red);
 padding:9px 14px;
 border-radius:22px;
 font-weight:bold;
 font-size:13px;
}

.tabs button.active{
 background:var(--red);
 color:white;
 box-shadow:0 3px 10px #a7192d33;
}

/* CATEGORY BANNER */

.category-hero{
 position:relative;
 height:190px;
 border-radius:18px;
 overflow:hidden;
 margin:2px 0 18px;
 background:#3b2520;
 box-shadow:0 7px 18px #48231620;
}

.category-hero img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
}

.category-hero:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(
  90deg,
  #170b0bd9 0%,
  #170b0b55 60%,
  transparent 100%
 );
}

.hero-copy{
 position:absolute;
 z-index:1;
 left:18px;
 bottom:17px;
 color:white;
 text-shadow:0 2px 8px #0008;
}

.hero-copy span{
 display:block;
 font-size:11px;
 letter-spacing:2px;
 text-transform:uppercase;
 color:#ffe2a1;
 font-weight:bold;
 margin-bottom:5px;
}

.hero-copy h2{
 font-size:26px;
 margin:0;
 color:white;
}

/* SECTION LABEL */

.section-label{
 font-size:12px;
 color:#8b7468;
 font-weight:bold;
 letter-spacing:1.2px;
 text-transform:uppercase;
 margin:0 2px 7px;
}

/* FOOD LIST */

.item{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 padding:15px 4px;
 margin:0;
 background:transparent;
 border:0;
 border-bottom:1px solid #eadfd7;
 border-radius:0;
 box-shadow:none;
}

.item-info{
 display:block;
 flex:1;
 min-width:0;
}

.name{
 font-weight:600;
 line-height:1.4;
 font-size:14px;
}

.price{
 color:#8b5c45;
 margin-top:5px;
 font-size:14px;
 font-weight:normal;
}

/* QUANTITY BUTTONS */

.controls{
 display:flex;
 align-items:center;
 gap:9px;
 flex:none;
}

.controls button{
 width:32px;
 height:32px;
 border-radius:50%;
 border:1px solid var(--red);
 background:white;
 color:var(--red);
 font-size:20px;
 line-height:1;
 cursor:pointer;
}

.controls button.plus{
 background:var(--red);
 color:white;
}

.qty{
 min-width:15px;
 text-align:center;
 font-weight:bold;
}

/* EMPTY / LOADING */

.status{
 text-align:center;
 padding:35px 10px;
 color:#777;
}

/* BOTTOM ORDER BAR */

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#fff;
 padding:12px 16px max(13px,env(safe-area-inset-bottom));
 box-shadow:0 -3px 18px #0002;
 z-index:4;
}

.summary{
 max-width:570px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.total{
 font-size:21px;
 font-weight:bold;
 color:var(--red);
 margin-top:3px;
}

.order{
 width:100%;
 max-width:570px;
 display:block;
 margin:10px auto 0;
 background:var(--red);
 color:white;
 border:0;
 border-radius:12px;
 padding:13px;
 font-size:15px;
 font-weight:bold;
 cursor:pointer;
}

.whatsapp{
 background:#168b49;
}

/* ORDER MODAL */

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 display:none;
 align-items:flex-end;
 z-index:5;
}

.modal.show{
 display:flex;
}

.sheet{
 background:white;
 width:100%;
 max-width:600px;
 margin:auto;
 padding:22px;
 border-radius:20px 20px 0 0;
 max-height:85vh;
 overflow:auto;
}

.sheet h2{
 margin:0 0 14px;
 color:var(--red);
}

.line{
 display:flex;
 justify-content:space-between;
 gap:12px;
 padding:9px 0;
 border-bottom:1px solid #f0e8e2;
}

.note{
 text-align:center;
 font-size:12px;
 color:#777;
}

/* RESPONSIVE */

@media(min-width:600px){
 .category-hero{
  height:230px;
 }
 .item{
  padding:16px 5px;
 }
 .sheet{
  border-radius:20px;
 }
}

@media(max-width:380px){
 .category-hero{
  height:165px;
 }
 .controls{
  gap:6px;
 }
 .controls button{
  width:30px;
  height:30px;
 }
 .item{
  padding:13px 2px;
 }
}
</style>
</head>

<body>

<header>
 <h1 id="restaurantName">DIGITAL FOOD MENU</h1>
 <p>SCAN • SELECT • ENJOY</p>
</header>

<main>

 <div class="tabs" id="tabs"></div>

 <div id="categoryHero"></div>

 <div class="section-label">
  Freshly prepared favourites
 </div>

 <div id="items" class="status">
  Loading menu...
 </div>

</main>

<!-- BOTTOM ORDER BAR -->

<div class="bottom">

 <div class="summary">

  <div>
   <div>
    <b>Selected Items:</b>
    <span id="count">0</span>
   </div>

   <div class="total" id="total">
    ₹0
   </div>
  </div>

  <button
   class="order"
   style="width:auto;margin:0"
   onclick="showOrder()">
   View Order
  </button>

 </div>

</div>

<!-- ORDER POPUP -->

<div
 class="modal"
 id="modal"
 onclick="if(event.target===this)closeOrder()">

 <div class="sheet">

  <h2>Your Order</h2>

  <div id="orderList"></div>

  <hr>

  <div class="line">
   <b>Total Amount</b>
   <b id="finalTotal">₹0</b>
  </div>

  <button
   class="order whatsapp"
   onclick="sendWhatsApp()">
   Send Order on WhatsApp
  </button>

  <p class="note">
   WhatsApp will open with your order details.
  </p>

  <button
   class="order"
   onclick="closeOrder()">
   Continue Menu
  </button>

 </div>

</div>

<script>
"use strict";

const $=id=>document.getElementById(id);

let restaurant=null;
let menuItems=[];
let selected={};
let currentCategory="";

const slug=
 new URLSearchParams(location.search).get("r");

/* CATEGORY BANNER PHOTOS */

const visuals=[

 {
  re:/burger/i,
  title:"Burgers",
  tag:"Juicy • Fresh • Delicious",
  image:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1200&q=85"
 },

 {
  re:/pizza/i,
  title:"Pizza",
  tag:"Hot from the oven",
  image:"https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=1200&q=85"
 },

 {
  re:/sandwich/i,
  title:"Sandwiches",
  tag:"Grilled • Toasted • Tasty",
  image:"https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=1200&q=85"
 },

 {
  re:/fries/i,
  title:"Fries",
  tag:"Crispy in every bite",
  image:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=1200&q=85"
 },

 {
  re:/drink|beverage/i,
  title:"Drinks",
  tag:"Cool • Creamy • Refreshing",
  image:"https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=1200&q=85"
 }

];

const fallback=
 "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1200&q=85";

/* HELPERS */

function money(value){
 return "₹"+Number(value).toLocaleString("en-IN");
}

function esc(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function visualFor(category){

 return visuals.find(v=>
  v.re.test(category||"")
 )||{
  title:category||"Our Menu",
  tag:"Made fresh for you",
  image:fallback
 };

}

/* LOAD RESTAURANT MENU */

async function loadMenu(){

 if(!slug){
  throw new Error("Restaurant QR link is missing.");
 }

 const res=await fetch(
  "/api/menu/"+encodeURIComponent(slug),
  {
   cache:"no-store",
   headers:{
    "Accept":"application/json"
   }
  }
 );

 const data=await res.json().catch(()=>({}));

 if(!res.ok){
  throw new Error(
   data.error||"Menu loading failed."
  );
 }

 if(!data.restaurant){
  throw new Error("Restaurant not found.");
 }

 restaurant=data.restaurant;

 menuItems=Array.isArray(data.items)
  ?data.items:[ ];

 $("restaurantName").textContent=restaurant.name;

 document.title=
  restaurant.name+" - Food Menu";

 renderTabs();

 if(menuItems.length){
  renderItems();
 }else{
  $("items").innerHTML=
   '<div class="status">Menu items are not available yet.</div>';

  $("categoryHero").innerHTML="";
 }

 updateTotal();

}

/* CATEGORIES */

function categories(){

 return [
  ...new Set(
   menuItems.map(i=>i.category).filter(Boolean)
  )
 ];

}

/* CATEGORY TABS */

function renderTabs(){

 const list=categories();

 if(!list.includes(currentCategory)){
  currentCategory=list[0]||"";
 }

 $("tabs").innerHTML=list.map(category=>`

  <button
   class="${category===currentCategory?"active":""}"
   data-category="${esc(category)}">

   ${esc(category)}

  </button>

 `).join("");

 $("tabs").querySelectorAll("button")
 .forEach(button=>{

  button.addEventListener("click",()=>{

   currentCategory=button.dataset.category;

   renderTabs();
   renderItems();

  });

 });

}

/* CATEGORY BANNER */

function renderHero(){

 const visual=visualFor(currentCategory);

 $("categoryHero").innerHTML=`

  <section class="category-hero">

   <img
    src="${visual.image}"
    alt="${esc(visual.title)} food"
    loading="lazy"
    onerror="this.onerror=null;this.src='${fallback}'"
   >

   <div class="hero-copy">

    <span>${esc(visual.tag)}</span>

    <h2>${esc(visual.title)}</h2>

   </div>

  </section>

 `;

}

/* FOOD LIST - NO ITEM PHOTOS */

function renderItems(){

 renderHero();

 const list=menuItems.filter(item=>
  item.category===currentCategory
 );

 if(!list.length){

  $("items").innerHTML=
   '<div class="status">No food items in this category.</div>';

  return;

 }

 $("items").innerHTML=list.map(item=>`

  <div class="item">

   <div class="item-info">

    <div class="name">
     ${esc(item.name)}
    </div>

    <div class="price">
     ${money(item.price)}
    </div>

   </div>

   <div class="controls">

    <button
     aria-label="Remove one"
     data-id="${esc(item.id)}"
     data-change="-1">
     −
    </button>

    <span class="qty">
     ${selected[item.id]||0}
    </span>

    <button
     class="plus"
     aria-label="Add one"
     data-id="${esc(item.id)}"
     data-change="1">
     +
    </button>

   </div>

  </div>

 `).join("");

 $("items").querySelectorAll("[data-change]")
 .forEach(button=>{

  button.addEventListener("click",()=>{

   updateQty(
    button.dataset.id,
    Number(button.dataset.change)
   );

  });

 });

}

/* QUANTITY */

function updateQty(id,change){

 const item=menuItems.find(i=>
  String(i.id)===String(id)
 );

 if(!item)return;

 selected[id]=Math.max(
  0,
  Math.min(99,(selected[id]||0)+change)
 );

 if(selected[id]===0){
  delete selected[id];
 }

 renderItems();
 updateTotal();

}

/* TOTAL */

function getTotal(){

 return menuItems.reduce((sum,item)=>{

  return sum+
   (selected[item.id]||0)*Number(item.price);

 },0);

}

function updateTotal(){

 const count=Object.values(selected).reduce(
  (sum,qty)=>sum+qty,
  0
 );

 $("count").textContent=count;
 $("total").textContent=money(getTotal());

}

/* ORDER PREVIEW */

function showOrder(){

 const chosen=menuItems.filter(item=>
  selected[item.id]>0
 );

 if(!chosen.length){

  alert("Please select an item first!");

  return;

 }

 $("orderList").innerHTML=chosen.map(item=>`

  <div class="line">

   <span>
    ${esc(item.name)} × ${selected[item.id]}
   </span>

   <b>
    ${money(
     Number(item.price)*selected[item.id]
    )}
   </b>

  </div>

 `).join("");

 $("finalTotal").textContent=money(getTotal());

 $("modal").classList.add("show");

}

/* WHATSAPP NUMBER */

function indianNumber(value){

 let number=String(value||"").replace(/\D/g,"");

 if(number.startsWith("0091")){
  number=number.slice(2);
 }

 if(number.startsWith("91")&&number.length===12){
  return number;
 }

 if(number.startsWith("0")&&number.length===11){
  number=number.slice(1);
 }

 if(number.length===10){
  return "91"+number;
 }

 return number;

}

/* SEND WHATSAPP ORDER */

function sendWhatsApp(){

 const number=indianNumber(
  restaurant?.whatsapp
 );

 if(!/^[1-9]\d{9,14}$/.test(number)){

  alert(
   "Restaurant WhatsApp number is missing or invalid. Please ask the owner to update it."
  );

  return;

 }

 const chosen=menuItems.filter(item=>
  selected[item.id]>0
 );

 if(!chosen.length)return;

 const lines=chosen.map((item,index)=>

  `${index+1}. ${item.name} x ${selected[item.id]} = ${
   money(
    Number(item.price)*selected[item.id]
   )
  }`

 );

 const message=
  `*New Food Order - ${restaurant.name}*\n\n`+
  lines.join("\n")+
  `\n\n*Total: ${money(getTotal())}*`;

 const whatsappURL=
  "https://wa.me/"+number+
  "?text="+encodeURIComponent(message);

 window.open(whatsappURL,"_blank");

}

/* CLOSE ORDER */

function closeOrder(){

 $("modal").classList.remove("show");

}

/* START */

loadMenu().catch(error=>{

 console.error("MENU ERROR:",error);

 $("items").innerHTML=`
  <div class="status">
   ${esc(error.message)}
  </div>
 `;

 $("tabs").innerHTML="";
 $("categoryHero").innerHTML="";

});

</script>

</body>
</html>

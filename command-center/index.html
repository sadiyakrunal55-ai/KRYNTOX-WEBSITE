
<script>
const data = [
["👑","COMMANDER AI","Team Strategy and Coordination","Planning, task allocation, workflow supervision and final reporting."],
["🛡️","SECURITYZ+","Cyber Security","Access protection, threat analysis, security reviews and backup planning."],
["💻","DEVELOPER PRO","Software Engineering","Website development, app development, coding and testing."],
["🎨","DESIGNER X","Creative Design","UI/UX, branding, visual identity and creative assets."],
["🔬","RESEARCH NEXUS","Research Intelligence","Market research, competitor analysis and business opportunities."],
["📢","MARKETING TITAN","Growth Strategy","Marketing campaigns, social media and brand growth."],
["🎯","CLIENT HUNTER X","Sales Intelligence","Lead qualification, outreach planning, pipeline and follow-ups."],
["🎧","SUPPORT GENIUS","Customer Experience","Customer service, issue tracking and feedback management."]
];

function loadData(key) {
 try {
  const value = JSON.parse(localStorage.getItem(key) || "[]");
  return Array.isArray(value) ? value : [];
 } catch {
  return [];
 }
}

let leads = loadData("kx_leads");
let projects = loadData("kx_projects");

function show(id) {
 document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
 const page = document.getElementById(id);
 if (page) page.classList.add("active");
 refresh();
 window.scrollTo(0, 0);
}

function openAgent(i) {
 const a = data[i];
 if (!a) return;

 document.getElementById("aemoji").textContent = a[0];
 document.getElementById("aname").textContent = a[1];
 document.getElementById("adesc").textContent = a[2];
 document.getElementById("atasks").textContent = a[3];
 document.getElementById("tasknote").value = "";
 document.getElementById("notesaved").textContent = "";
 show("agent");
}

document.getElementById("agents").innerHTML = data.map((a, i) => `
 <button class="card agent" onclick="openAgent(${i})">
  <span class="emoji">${a[0]}</span>
  <div>
   <h3>${a[1]}</h3>
   <p>${a[2]}</p>
   <small>Open Agent →</small>
  </div>
 </button>
`).join("");

async function saveNote() {
 const agentName = document.getElementById("aname").textContent.trim();
 const note = document.getElementById("tasknote").value.trim();
 const status = document.getElementById("notesaved");
 const button = document.getElementById("saveTaskBtn");

 if (!agentName || !note) {
  status.textContent = "Please enter a task or instruction.";
  return;
 }

 button.disabled = true;
 button.textContent = "Saving...";
 status.textContent = "Connecting to database...";

 try {
  const response = await fetch("/api/commander", {
   method: "POST",
   headers: {
    "Content-Type": "application/json"
   },
   body: JSON.stringify({
    task: agentName + ": " + note
   })
  });

  const result = await response.json();

  if (!response.ok || !result.success) {
   throw new Error(result.message || "Database save failed.");
  }

  status.textContent =
   "Task saved successfully! ID: " + result.taskId;

  document.getElementById("tasknote").value = "";

 } catch (error) {
  status.textContent = "Error: " + error.message;
 } finally {
  button.disabled = false;
  button.textContent = "Save Task to Database";
 }
}

function addLead() {
 const name = document.getElementById("cname").value.trim();
 const phone = document.getElementById("cphone").value.trim();
 const stage = document.getElementById("cstage").value;

 if (!name) {
  alert("Enter business name");
  return;
 }

 leads.push({ name, phone, stage });
 localStorage.setItem("kx_leads", JSON.stringify(leads));

 document.getElementById("cname").value = "";
 document.getElementById("cphone").value = "";

 refresh();
}

function addProject() {
 const name = document.getElementById("pname").value.trim();
 const status = document.getElementById("pstatus").value;

 if (!name) {
  alert("Enter project name");
  return;
 }

 projects.push({ name, status });
 localStorage.setItem("kx_projects", JSON.stringify(projects));

 document.getElementById("pname").value = "";
 refresh();
}

function escapeHTML(value) {
 return String(value || "").replace(/[&<>"']/g, c => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
 })[c]);
}

function refresh() {
 document.getElementById("leadlist").innerHTML =
  leads.map(l => `
   <div class="card">
    <h3>${escapeHTML(l.name)}</h3>
    <p>${escapeHTML(l.phone)}</p>
    <small>${escapeHTML(l.stage)}</small>
   </div>
  `).join("") || '<p class="muted">No leads added yet.</p>';

 document.getElementById("projectlist").innerHTML =
  projects.map(p => `
   <div class="card">
    <h3>${escapeHTML(p.name)}</h3>
    <small>${escapeHTML(p.status)}</small>
   </div>
  `).join("") || '<p class="muted">No projects added yet.</p>';

 const won = leads.filter(l => l.stage === "Won").length;

 document.getElementById("deals").textContent = won;
 document.getElementById("rdeals").textContent = won;
 document.getElementById("rleads").textContent = leads.length;
 document.getElementById("rrevenue").textContent = "₹0";
 document.getElementById("revenue").textContent = "₹0";
}

refresh();
</script>
